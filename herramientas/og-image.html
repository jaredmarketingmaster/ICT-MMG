<!doctype html><html><head><meta charset="utf-8">
<!-- Plantilla de assets/img/og-image.png (1200 × 630). Para regenerarla: node herramientas/og-image.cjs (ver README). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&display=swap">
<style>
  html,body{margin:0}
  .og{position:relative;width:1200px;height:630px;overflow:hidden;font-family:Barlow,sans-serif;color:#fff;
      background:linear-gradient(135deg,#1A73E8 0%,#2A4F86 45%,#2D3748 100%)}
  .og svg.patron{position:absolute;inset:0}
  .marca{position:absolute;left:80px;top:64px;display:flex;align-items:center;gap:18px;font-weight:700;font-size:26px;letter-spacing:.06em}
  .marca img{height:66px}
  h1{position:absolute;left:80px;top:184px;width:1020px;margin:0;font-weight:700;font-size:58px;line-height:1.14}
  .pill{position:absolute;left:80px;bottom:64px;display:flex;align-items:center;gap:16px;padding:18px 28px;border-radius:999px;
        background:#2D3748;border:2px solid #37B1AB;color:#6FD1CB;font-weight:700;font-size:28px}
  .pill i{width:18px;height:20px;background:#37B1AB;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
  .logo{position:absolute;right:84px;bottom:76px;height:40px}
</style></head><body>
<div class="og">
  <svg class="patron" width="1200" height="630"><defs>
    <pattern id="hex" width="64" height="110.85" patternUnits="userSpaceOnUse">
      <path d="M32 0 L64 18.48 L64 55.43 L32 73.9 L0 55.43 L0 18.48 Z M32 73.9 L32 110.85 M0 55.43 L-32 73.9 M64 55.43 L96 73.9" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="1.5"/>
    </pattern></defs><rect width="1200" height="630" fill="url(#hex)"/></svg>
  <div class="marca"><img src="../assets/img/logo-mmg.svg" alt="">MARKETING MASTER TOP</div>
  <h1>El objetivo: 15 ventas de iPhone en 30&nbsp;días, atribuidas a Meta y registradas una por una en tu CRM.</h1>
  <div class="pill"><i></i>Máximo 5 tiendas por ciudad</div>
  <img class="logo" src="../assets/img/ictc-logotipo-fondo-oscuro.svg" alt="">
</div></body></html>
