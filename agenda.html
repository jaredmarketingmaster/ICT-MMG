<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tu tienda califica — ICTC | Marketing Master Top</title>
  <!-- BETA: quitar esta línea cuando salga la versión definitiva. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2D3748">
  <link rel="icon" href="assets/img/ictc-favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Google Fonts sin bloquear el primer pintado (display=swap muestra la fuente de respaldo mientras carga). -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow:wght@700&amp;family=Lato:ital,wght@0,400;0,700;0,900;1,400&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@700&amp;family=Lato:ital,wght@0,400;0,700;0,900;1,400&amp;display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@700&amp;family=Lato:ital,wght@0,400;0,700;0,900;1,400&amp;display=swap"></noscript>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    // Variante de idioma (ver assets/js/idioma.js): rioplatense en Argentina,
    // neutro en el resto. Se decide ANTES de pintar para que no parpadee.
    (function () {
      var r = document.documentElement, v = "ar";
      try {
        var q = new URLSearchParams(location.search).get("es"), s = null;
        try { s = sessionStorage.getItem("ict_idioma"); } catch (e) {}
        var z = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
        v = (q === "ar" || q === "neutro") ? q : (s === "ar" || s === "neutro") ? s
          : z ? (/^America\/(Argentina\/|Buenos_Aires$|Catamarca$|Cordoba$|Jujuy$|Mendoza$|Rosario$)/.test(z) ? "ar" : "neutro") : "ar";
      } catch (e) {}
      r.setAttribute("data-idioma", v);
      // Red de seguridad: si el JS no llega a traducir, la página se muestra igual.
      setTimeout(function () { r.classList.add("idioma-listo"); }, 1500);
    })();
  </script>
  <link rel="modulepreload" href="config.js">
  <!-- Idioma primero y por separado: solo depende de config.js, así no espera al resto. -->
  <script type="module" src="assets/js/idioma.js"></script>
  <script type="module" src="assets/js/agenda.js"></script>
</head>
<body>
  <a class="saltar-al-contenido" href="#contenido">Saltar al contenido</a>

  <div id="encabezado" data-cta=""></div>

  <main id="contenido" class="pagina-simple">
    <div class="contenedor">
      <h1>Tu tienda califica</h1>
      <p class="pagina-simple__texto">Elegí el horario que te quede mejor (hora Argentina). Te vamos a confirmar por WhatsApp. Para aprovechar los 30 minutos, tené a mano cuánto invertís hoy en pauta, cuántos chats te llegan al mes y cuánto te deja cada iPhone.</p>
      <!-- Calendario de GHL (CONFIG.calendarioUrl). Sin URL, agenda.js muestra un placeholder. -->
      <div class="calendario" id="calendario"></div>
    </div>
  </main>

  <div id="pie"></div>
</body>
</html>
